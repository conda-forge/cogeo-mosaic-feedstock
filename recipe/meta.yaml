{% set name = "cogeo-mosaic" %}
{% set version = "9.2.0" %}
{% set python_min = "3.11" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/cogeo_mosaic-{{ version }}.tar.gz
  sha256: 8694c3104063662d1ae79fca139eed38d591417af318b9dd89855419e76e2440

build:
  number: 0
  noarch: python
  entry_points:
    - cogeo-mosaic = cogeo_mosaic.scripts.cli:cogeo_cli
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - hatchling
    - hatch-fancy-pypi-readme
    - python {{ python_min }}
  run:
    - python >={{ python_min }}
    - attrs
    - morecantile >=7.0
    - rio-tiler >=8.0,<10.0
    - shapely >=2.0,<3.0
    - pydantic ~=2.0
    - pydantic-settings ~=2.0
    - httpx2
    - rasterio
    - supermorecado
    - cachetools
    - boto3
    - google-cloud-storage
    - cligj
    - numpy
    - click
    - click-plugins

test:
  imports:
    - cogeo_mosaic
    - cogeo_mosaic.backends
    - cogeo_mosaic.scripts.cli
  commands:
    - pip check
    - cogeo-mosaic --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://developmentseed.org/cogeo-mosaic
  summary: Create mosaicJSON.
  license: MIT
  license_file: LICENSE
  dev_url: https://github.com/developmentseed/cogeo-mosaic.git

extra:
  recipe-maintainers:
    - martinRenou
    - andrewannex
    - lsetiawan
    - andrewannex
